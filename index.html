<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaktika IQ - Kirish</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="space-bg">
        <div class="stars"></div>
        <div class="twinkling"></div>
    </div>

    <div class="menu-wrapper">
        <div class="hamburger" onclick="toggleMenu()">
            <span></span><span></span><span></span>
        </div>
        <div id="sidebar" class="sidebar">
            <h3>TILNI TANLANG</h3>
            <button onclick="changeLang('uz')">🇺🇿 O'zbek Tili</button>
            <button onclick="changeLang('en')">🇺🇸 English</button>
            <button onclick="changeLang('ru')">🇷🇺 Русский язык</button>
        </div>
    </div>

    <div class="main-container">
        <div class="auth-card">
            <h1 class="neon-title">KIRISH</h1>
            <div class="auth-buttons">
                <button class="auth-btn google" onclick="enterApp()">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg"> Google orqali kirish
                </button>
                <button class="auth-btn facebook" onclick="enterApp()">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/0/05/Facebook_Logo_(2019).png"> Facebook orqali kirish
                </button>
                <button class="auth-btn whatsapp" onclick="enterApp()">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg"> WhatsApp orqali kirish
                </button>
                <div class="phone-input-group">
                    <input type="tel" placeholder="+998 90 123 45 67">
                    <button class="auth-btn phone" onclick="enterApp()">Nomer orqali kirish</button>
                </div>
            </div>
        </div>
    </div>

    <div id="quiz-part" class="hidden">
        </div>

    <script src="index.js"></script>
</body>
</html>
