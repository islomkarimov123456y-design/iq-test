<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mega IQ Test Platformasi</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="animated-bg"></div>
    <div class="container">
        <div id="home-screen" class="screen">
            <h1 class="glow-text">IQ TEST PLATFORMA</h1>
            <p>Yo'nalishni tanlang va bilimingizni sinang:</p>
            <div class="subject-grid">
                <button class="subj-btn" onclick="selectSubject('matematika')">🧮 Matematika</button>
                <button class="subj-btn" onclick="selectSubject('fizika')">⚡ Fizika</button>
                <button class="subj-btn" onclick="selectSubject('ingliz')">🇬🇧 Ingliz Tili</button>
                <button class="subj-btn" onclick="selectSubject('mantiq')">🧠 Mantiq</button>
            </div>
        </div>

        <div id="quiz-screen" class="screen hidden">
            <div class="header">
                <div class="timer-box">⏱ <span id="time">02:00</span></div>
                <div class="score-box">IQ: <span id="iq-count">100</span></div>
            </div>
            <div id="feedback-icon" class="feedback-anim"></div>
            <div class="question-container">
                <h2 id="question-text">Savol yuklanmoqda...</h2>
                <div id="options" class="options-list"></div>
            </div>
        </div>

        <div id="result-screen" class="screen hidden">
            <h2 class="glow-text">TEST YAKUNLANDI</h2>
            <div class="final-score" id="final-iq">0</div>
            <p id="result-msg"></p>
            <button class="restart-btn" onclick="location.reload()">ASOSIY MENYU</button>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
