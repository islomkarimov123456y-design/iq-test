<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xalqaro IQ Test</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="stars"></div>
    <div class="container">
        <div id="home-screen" class="screen">
            <div class="logo">🧠</div>
            <h1>Xalqaro IQ Test</h1>
            <p>Mantiqiy salohiyatingizni dunyo standartlari bo'yicha tekshiring.</p>
            <div class="info-grid">
                <div class="info-item">⏱ <span>2 daqiqa</span></div>
                <div class="info-item">📝 <span>10 ta savol</span></div>
            </div>
            <button class="btn main-btn" onclick="startQuiz()">Testni Boshlash</button>
        </div>

        <div id="quiz-screen" class="screen hidden">
            <div class="quiz-header">
                <div id="timer">Vaqt: <span id="time">02:00</span></div>
                <div id="progress">Savol: <span id="current-q">1</span>/10</div>
            </div>
            <div class="question-box">
                <h2 id="question-text">Savol yuklanmoqda...</h2>
                <div id="options-container" class="options-grid"></div>
            </div>
        </div>

        <div id="result-screen" class="screen hidden">
            <h2>Sizning Natijangiz</h2>
            <div class="iq-score" id="iq-result">0</div>
            <p id="result-text">Ajoyib natija!</p>
            <button class="btn secondary-btn" onclick="location.reload()">Qayta urinish</button>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
